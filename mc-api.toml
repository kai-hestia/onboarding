[tools]
node = "20"

[tasks.build]
description = "Bundle mc-api for local run with hardware mocks (output in gitignored api/)"
run = '''
npx ncc build index.js -o api -m
rm -rf api/bin
cp -r bin api/bin
printf '#!/bin/sh\nexit 0\n' > api/bin/gpio
printf '#!/bin/sh\nexit 0\n' > api/bin/brightness
printf '#!/bin/sh\necho "####################"\nexit 0\n' > api/bin/pic32prog
printf '#!/bin/sh\n[ -f .api.pid ] && kill "$(cat .api.pid)" 2>/dev/null\nexit 0\n' > api/bin/systemctl
# mark wake-ups so the simulator can boot again (board_enable runs on wake)
printf '\ntouch /tmp/mc-mock-reset\n' >> api/bin/board_enable.sh
cat > api/bin/serialcom <<'MOCK'
#!/usr/bin/env node
// Fake multicooker controller for local dev: answers the command/file-upload
// protocol and simulates a cook cycle so the UI can navigate.
// boot like a real controller: RESET routes the UI to the activation screen;
// sending INIT marks the machine initialized and drops it to IDLE
const fs = require('fs')
const RESET_FLAG = '/tmp/mc-mock-reset'
try { fs.unlinkSync(RESET_FLAG) } catch {}
const state = { status: 'IDLE', sys: 'RESET', alert: -1, temperature: 25, target: 0, heating: 0, cook: 0, motion: 0 }
// controller settings.json (same shape the real controller serializes via ~SETTINGS)
const settings = {
  version: 6, feat_version: 0, bug_version: 10, test_version: 1, hostname: 'CM1',
  Heater_PID_P: 5, Heater_PID_I: 0.5, Heater_PID_D: 0, Heater_PID_windupGuard: 100,
  TempControlDeadZone: 3, MAX_TARGET_TEMP: 300,
  FEED_LOAD: [5, 890, 1770, 2650, 3540, 4420, 5308],
  FEED_POUR: [1073, 1958, 2843, 3728, 4613, 5498, 6383],
  FEED_POUR_RETRACT: 130, PUSH_BOX: 765, PUSH_RETRY_OFFSET: 100, PUSH_WAIT: 560,
  GRIP_IDLE: 0, GRIP_POUR: 4240, GRIP_MON_TOP: 1800, GRIP_WOK_LOAD: 5000,
  GRIP_GETBOX: [9120, 9120, 9120, 9120, 9120, 9120, 9120],
  PLATE_LOADFOOD: 10932, PLATE_STARTLOAD: 7555, PLATE_SERVEFOOD: 0, PLATE_CHECK: 3663,
  WOK_FRY: 1112, WOK_LOADFOOD: 168, WOK_LOADLQ: 0, WOK_UNLOADFOOD_END: 3960,
  WOK_UNLOADFOOD_START: 1545, WOK_CLEANING: 4130, WOK_CHANGE: 2675, WOK_CLEAN_BASE: 2000,
  ENABLE_PLATE_SNR: 1, ENABLE_GRIP_HOME2: 1, ENABLE_GRIP_HOMEM: 1, ENABLE_CONV_FRONT_SNR: 1,
  ENABLE_TEMP_DIFF_CHK: 0, ENABLE_EXTEND_CLEAN: 0, DISABLE_LOWSPD_CHK: 0,
  ENABLE_CLEAN_CONFIRM: 0, ENABLE_FINGER_MID_CHK: 1, ENABLE_POWDER_WATER: 0,
  WATER_WAIT_OUT: 11131, OIL_WAIT_OUT: 2000, STARCH_WAIT_OUT: 4616,
  WATER_TUNE_CNST: 124600, OIL_TUNE_CNST: 721, STARCH_TUNE_CNST: 327,
  OIL_BACKPROP: 0, STARCH_FORWARDPROP: 0, WOKCHANGE_LIMIT: 250,
  GRIP_FLIP_UP: 57, GRIP_FLIP_DOWN: 346, GRIP_FLIP_THROWBOX: -10, GRIP_FLIP_DOWN_TILT: 370,
  GRIP_FINGER_FIRM: 580, POT_YAW_CAL_K: 1.111,
  GRIP_SLOW_ACC: 18000, ENABLE_GRIP_SLOW: false,
}
const out = (line) => process.stdout.write(line + '\n')
const send_settings = () => {
  out('~SETTINGS: START')
  out(JSON.stringify(settings))
  out('~SETTINGS: END')
}
const tick = () => {
  // board_enable.sh touches the flag on wake; boot again so the UI can re-activate
  if (fs.existsSync(RESET_FLAG)) {
    try { fs.unlinkSync(RESET_FLAG) } catch {}
    Object.assign(state, { sys: 'RESET' })
  }
  out('~STATUS: ' + JSON.stringify(state))
}
let timers = []
const at = (ms, fn) => timers.push(setTimeout(fn, ms))
function start_cook(id) {
  timers.forEach(clearTimeout)
  timers = []
  out('~ORDER: ' + id)
  out('~PREPINFO: 0 1 1 1 1 1 1 1 0')
  Object.assign(state, { status: 'BUSY', sys: 'PRECOOK', cook: 1, heating: 0, target: 0 })
  tick()
  at(4000, () => { Object.assign(state, { cook: 2 }); tick() })
  at(8000, () => {
    out('~COOKINFO: 0 (POURBOXF) (WOKTEMP 180) 1 3 60 180')
    Object.assign(state, { sys: 'COOK', cook: 3, heating: 1, target: 180 })
    tick()
  })
  at(14000, () => {
    out('~COOKINFO: 0 (WOKTEMP 180) (POURFOOD) 2 3 60 120')
    tick()
  })
  at(20000, () => {
    out('~COOKINFO: 0 (POURFOOD) (POURFOOD) 3 3 0 0')
    Object.assign(state, { status: 'IDLE', sys: 'IDLE', cook: 0, heating: 0, target: 0 })
    tick()
  })
}
let buf = Buffer.alloc(0)
let upload = null
let last_upload = null
const handle = (line) => {
  if (!line) return
  const [cmd, ...args] = line.split(' ')
  if (cmd === 'UPLOADF') {
    out('~CMD: OK')
    upload = { name: args[0], remaining: parseInt(args[1], 10) || 0, data: Buffer.alloc(0) }
    out('~UPLOADF: START')
  } else if (cmd === 'LOADF') {
    out('~CMD: OK')
    if (last_upload && last_upload.name === 'settings.json') {
      try { Object.assign(settings, JSON.parse(last_upload.data.toString('utf8'))) } catch (e) { out('~Error: settings parse failed') }
      send_settings()
    }
    last_upload = null
  } else if (cmd === 'COOK' || cmd === 'SCOOK') {
    out('~CMD: OK')
    start_cook(args[0])
  } else if (cmd === 'INIT') {
    out('~CMD: OK')
    out('~INIT: 127 127')
    Object.assign(state, { sys: 'IDLE' })
    tick()
    send_settings()
  } else {
    out('~CMD: OK')
  }
}
const pump = () => {
  for (;;) {
    if (upload !== null) {
      const size = Math.min(1024, upload.remaining)
      if (buf.length < size + 2) return
      upload.data = Buffer.concat([upload.data, buf.subarray(0, size)])
      buf = buf.subarray(size + 2)
      upload.remaining -= size
      out('~UPLOADF: CHUNK')
      if (upload.remaining <= 0) { last_upload = upload; upload = null }
      continue
    }
    if (buf.length < 52) return
    const line = buf.subarray(0, 50).toString('utf8').split('\0')[0].trim()
    buf = buf.subarray(52)
    handle(line)
  }
}
process.stdin.on('data', (d) => { buf = Buffer.concat([buf, d]); pump() })
setInterval(tick, 1000)
tick()
MOCK
chmod +x api/bin/*
[ -f api/menu/cuisinesbymenu.json ] || (mkdir -p api/menu && printf '%s\n' '[{"name":"Sample Menu","results":[{"name":"Sample Category","results":[{"id":1,"name":"Sample Recipe"}]}]}]' > api/menu/cuisinesbymenu.json)
[ -f api/menu/1.json ] || printf '%s\n' '{"uuid":"00000000-0000-0000-0000-000000000001","cuisine_name":"Sample Recipe","actions":[{"time":60}]}' > api/menu/1.json
mkdir -p api/menu/machine api/tmp
[ -f api/menu/machine/1_1_v1.json ] || (printf '%s\n' '{"id":1,"version":1,"uuid":"00000000-0000-0000-0000-000000000001","cuisine_name":"Sample Recipe","actions":[{"time":60}]}' > api/menu/machine/1_1_v1.json)
node -e "const fs=require('fs'),f='api/settings.json';const s=fs.existsSync(f)?JSON.parse(fs.readFileSync(f)):{};s.disable_ui_clients_check=true;s.machine_name='DEV';fs.writeFileSync(f,JSON.stringify(s,null,2))"
'''

[tasks.dev]
description = "Run mc-api on :3000 (hardware mocked, auto-restarts like the systemd unit)"
depends = ["build"]
dir = "{{config_root}}/api"
run = '''
trap 'rm -f .api.pid; exit 0' INT TERM
while true; do
  PATH="$PWD/bin:$PATH" node index.js &
  NODE_PID=$!
  echo "$NODE_PID" > .api.pid
  if wait "$NODE_PID"; then
    code=0
  else
    code=$?
  fi
  echo "mc-api exited (code $code), restarting in 2s... (Ctrl+C to stop)"
  sleep 2
done
'''
